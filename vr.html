<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Recorrido Virtual - Modo VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Motor WebXR (A-Frame) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #exit-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid #fff;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #exit-btn:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>

  <button id="exit-btn" onclick="exitToStandardView()">← Volver a vista normal</button>

  <a-scene webxr="optionalFeatures: hit-test, local-floor">
    
    <!-- Imagen Panorámica 360 -->
    <a-sky id="sky" radius="10" rotation="0 0 0"></a-sky>

    <!-- Contenedor dinámico de Hotspots -->
    <a-entity id="hotspots-container"></a-entity>

    <!-- Cámara y Controles -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera look-controls="pointerLockEnabled: false">
        <a-cursor 
          id="gaze-cursor" 
          fuse="true" 
          fuse-timeout="1200" 
          raycaster="objects: .clickable" 
          material="color: #00ffff; shader: flat" 
          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
          position="0 0 -1"
          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1200; from: 1 1 1; to: 0.1 0.1 0.1"
          animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 300; to: 1 1 1"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">
        </a-cursor>
      </a-camera>

      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #00ffff"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #00ffff"></a-entity>
    </a-entity>

    <!-- PIVOTE PARA TARJETA 3D (DISEÑO MEJORADO) -->
    <a-entity id="card-wrapper">
      <a-entity id="card-3d" position="0 0 -2.5" visible="false">
        
        <!-- Fondo dinámico oscuro -->
        <a-plane id="card-bg" width="3.0" height="3.2" color="#111111" opacity="0.95"></a-plane>
        
        <!-- Botón de Cerrar (X) arriba a la derecha -->
        <a-plane id="card-close" class="clickable" position="1.3 1.4 0.03" width="0.3" height="0.3" color="#d32f2f">
          <a-text value="X" align="center" position="0 0 0.01" scale="1.2 1.2 1.2" font="https://cdn.aframe.io/fonts/DejaVu-sdf.fnt"></a-text>
        </a-plane>

        <!-- Imagen de la pieza (se oculta si no hay imagen) -->
        <a-image id="card-img" src="" position="0 0.7 0.02" width="2.6" height="1.2" visible="false"></a-image>
        
        <!-- Título y Texto (Usando fuente DejaVu para soportar acentos y ñ) -->
        <a-text id="card-title" value="Título" position="-1.3 -0.1 0.02" anchor="left" baseline="top" color="#f5a623" width="2.8" wrap-count="38" font="https://cdn.aframe.io/fonts/DejaVu-sdf.fnt"></a-text>
        
        <a-text id="card-text" value="Descripción..." position="-1.3 -0.4 0.02" anchor="left" baseline="top" color="#ffffff" width="2.8" wrap-count="48" font="https://cdn.aframe.io/fonts/DejaVu-sdf.fnt"></a-text>
        
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    const JSON_URL = 'tour.json'; 
    let tourData = null;
    let currentSceneId = '';

    const urlParams = new URLSearchParams(window.location.search);
    const requestedScene = urlParams.get('scene');

    fetch(JSON_URL)
      .then(res => res.json())
      .then(data => {
        tourData = data;
        const startScene = requestedScene || data.default.firstScene || Object.keys(data.scenes)[0];
        loadScene(startScene);
      })
      .catch(err => console.error("Error al cargar el archivo JSON:", err));

    // NUEVO PARSER: Extrae la imagen y el texto limpiamente
    function parseHotspotText(htmlContent) {
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = htmlContent.replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n\n');

      // 1. Extraer la URL de la imagen
      const imgElem = tempDiv.querySelector('img');
      const imgSrc = imgElem ? imgElem.getAttribute('src') : null;
      if (imgElem) imgElem.remove();

      // 2. Extraer el Título
      const titleElem = tempDiv.querySelector('h3');
      const title = titleElem ? titleElem.textContent.trim() : 'Información';
      if (titleElem) titleElem.remove();

      // 3. Extraer el texto descriptivo
      let body = tempDiv.textContent.trim();
      body = body.replace(/\n\s*\n/g, '\n\n');

      // Límite de texto para no desbordar el panel
      if (body.length > 600) {
        body = body.substring(0, 597) + '...';
      }

      return { title, body, imgSrc };
    }

    function loadScene(sceneId) {
      if (!tourData || !tourData.scenes[sceneId]) return;
      currentSceneId = sceneId;
      const scene = tourData.scenes[sceneId];

      document.querySelector('#sky').setAttribute('src', scene.panorama);
      
      const container = document.querySelector('#hotspots-container');
      container.innerHTML = '';
      document.querySelector('#card-3d').setAttribute('visible', 'false');

      if (!scene.hotSpots) return;

      scene.hotSpots.forEach(hs => {
        const pivot = document.createElement('a-entity');
        pivot.setAttribute('rotation', `${hs.pitch} ${-hs.yaw} 0`);

        if (hs.type === 'scene') {
          const sphere = document.createElement('a-sphere');
          sphere.setAttribute('position', '0 0 -4');
          sphere.setAttribute('radius', '0.22');
          sphere.setAttribute('color', '#00d2ff');
          sphere.setAttribute('material', 'emissive: #0077b6; emissiveIntensity: 0.6');
          sphere.setAttribute('class', 'clickable');
          sphere.setAttribute('animation', 'property: scale; to: 1.25 1.25 1.25; dir: alternate; loop: true; dur: 900');

          sphere.addEventListener('click', () => loadScene(hs.sceneId));
          pivot.appendChild(sphere);

        } else if (hs.type === 'info') {
          const infoSphere = document.createElement('a-sphere');
          infoSphere.setAttribute('position', '0 0 -4');
          infoSphere.setAttribute('radius', '0.20');
          infoSphere.setAttribute('color', '#f5a623');
          infoSphere.setAttribute('material', 'emissive: #cc7a00; emissiveIntensity: 0.7');
          infoSphere.setAttribute('class', 'clickable');

          infoSphere.addEventListener('click', () => {
            const { title, body, imgSrc } = parseHotspotText(hs.text);
            
            // Elementos del DOM 3D
            const cardWrapper = document.querySelector('#card-wrapper');
            const cardBg = document.querySelector('#card-bg');
            const cardImg = document.querySelector('#card-img');
            const cardTitle = document.querySelector('#card-title');
            const cardText = document.querySelector('#card-text');
            const cardClose = document.querySelector('#card-close');
            
            // Rotamos la tarjeta para mirarla de frente
            cardWrapper.setAttribute('rotation', `${hs.pitch} ${-hs.yaw} 0`);
            
            // LÓGICA DINÁMICA: Acomodar el diseño dependiendo de si hay imagen o no
            if (imgSrc) {
              cardImg.setAttribute('src', imgSrc);
              cardImg.setAttribute('visible', 'true');
              
              // Hacemos el panel más alto y bajamos los textos
              cardBg.setAttribute('height', '3.2');
              cardTitle.setAttribute('position', '-1.3 -0.1 0.02');
              cardText.setAttribute('position', '-1.3 -0.4 0.02');
              cardClose.setAttribute('position', '1.3 1.4 0.03');
            } else {
              cardImg.setAttribute('visible', 'false');
              
              // Hacemos el panel más corto y subimos los textos
              cardBg.setAttribute('height', '2.0');
              cardTitle.setAttribute('position', '-1.3 0.7 0.02');
              cardText.setAttribute('position', '-1.3 0.4 0.02');
              cardClose.setAttribute('position', '1.3 0.8 0.03');
            }

            cardTitle.setAttribute('value', title);
            cardText.setAttribute('value', body);
            document.querySelector('#card-3d').setAttribute('visible', 'true');
          });
          
          pivot.appendChild(infoSphere);
        }
        
        container.appendChild(pivot);
      });
    }

    document.querySelector('#card-close').addEventListener('click', () => {
      document.querySelector('#card-3d').setAttribute('visible', 'false');
    });

    function exitToStandardView() {
      window.location.href = `index.html?scene=${currentSceneId}`;
    }
  </script>
</body>
</html>
