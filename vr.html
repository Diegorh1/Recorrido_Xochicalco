<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="utf-8">

  <title>Recorrido Virtual - Modo VR</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Motor WebXR (A-Frame) -->

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Componente extra para orientar el panel hacia el usuario -->

  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>



  <style>
    body {

      margin: 0;

      background: #000;

      overflow: hidden;

      font-family: Arial, sans-serif;

    }

    #exit-btn {

      position: absolute;

      top: 15px;

      left: 15px;

      z-index: 9999;

      background: rgba(0, 0, 0, 0.8);

      color: #fff;

      border: 1px solid #fff;

      padding: 10px 16px;

      border-radius: 6px;

      cursor: pointer;

      font-size: 14px;

    }

    #exit-btn:hover {

      background: #fff;

      color: #000;

    }
  </style>

</head>

<body>



  <button id="exit-btn" onclick="exitToStandardView()">← Volver a vista normal</button>



  <a-scene webxr="optionalFeatures: hit-test, local-floor">



    <!-- Imagen Panorámica 360 -->

    <a-sky id="sky" radius="10" rotation="0 0 0"></a-sky>



    <!-- Contenedor dinámico de esferas de interacción -->

    <a-entity id="hotspots-container"></a-entity>



    <!-- Cámara y Controles (VR / Móvil / PC) -->

    <a-entity id="rig" position="0 1.6 0">

      <a-camera look-controls="pointerLockEnabled: false">

        <a-cursor id="gaze-cursor" fuse="true" fuse-timeout="1200" raycaster="objects: .clickable"
          material="color: #00ffff; shader: flat" geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
          position="0 0 -1"
          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1200; from: 1 1 1; to: 0.1 0.1 0.1"
          animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 300; to: 1 1 1"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1">

        </a-cursor>

      </a-camera>



      <!-- Punteros láser para Quest/Pico -->

      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #00ffff"></a-entity>

      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #00ffff"></a-entity>

    </a-entity>



    <!-- PANEL DE INFORMACIÓN 3D -->
    <a-entity id="card-wrapper" visible="false" scale="0 0 0" animation="property: scale; to: 1 1 1; dur: 500; easing: easeOutElastic; startEvents: showCard">

      <!-- Fondo oscuro translúcido -->

      <a-plane id="card-bg" width="3.0" height="3.2" color="#111111" opacity="0.95"></a-plane>



      <!-- Botón de Cerrar (X) -->

      <a-plane id="card-close" class="clickable" position="1.3 1.4 0.03" width="0.3" height="0.3" color="#d32f2f">

        <a-text value="X" align="center" position="0 0 0.01" scale="1.2 1.2 1.2"></a-text>

      </a-plane>



      <!-- Imagen (se ajusta dinámicamente) -->

      <a-image id="card-img" src="" position="0 0.8 0.02" width="2.6" height="1.2" visible="false"></a-image>



      <!-- Textos con Tipografía Roboto (Soporta Ñ y acentos) -->

      <a-text id="card-title" value="Título" position="-1.35 0.0 0.02" anchor="left" baseline="top" color="#f5a623"
        width="2.7" wrap-count="35"
        font="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/roboto/Roboto-Medium.json"
        shader="msdf"></a-text>



      <a-text id="card-text" value="Descripción..." position="-1.35 -0.3 0.02" anchor="left" baseline="top"
        color="#ffffff" width="2.7" wrap-count="45"
        font="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/roboto/Roboto-Regular.json"
        shader="msdf"></a-text>

    </a-entity>



  </a-scene>



  <script>

    const JSON_URL = 'tour.json';

    let tourData = null;

    let currentSceneId = '';



    // ==========================================

    // VARIABLES GLOBALES DE CALIBRACIÓN

    // ==========================================

    let yawOffset = 0;

    let pitchOffset = 0;



    const urlParams = new URLSearchParams(window.location.search);

    const requestedScene = urlParams.get('scene');



    fetch(JSON_URL)

      .then(res => res.json())

      .then(data => {

        tourData = data;

        const startScene = requestedScene || data.default.firstScene || Object.keys(data.scenes)[0];

        loadScene(startScene);

      })

      .catch(err => console.error("Error al cargar JSON:", err));



    // ========================================================

    // MATEMÁTICAS: Pannellum (Pitch/Yaw) a WebXR (X, Y, Z)

    // ========================================================

    function pannellumToCartesian(pitch, yaw, radius = 4.0) {

      const radYaw = (yaw + yawOffset) * (Math.PI / 180);

      const radPitch = (pitch + pitchOffset) * (Math.PI / 180);



      const x = radius * Math.cos(radPitch) * Math.sin(radYaw);

      const y = radius * Math.sin(radPitch);

      const z = -radius * Math.cos(radPitch) * Math.cos(radYaw);



      return `${x} ${y} ${z}`;

    }



    // ========================================================

    // PARSER: Limpiar y extraer datos del HTML del JSON

    // ========================================================

    function parseHotspotText(htmlContent) {

      const tempDiv = document.createElement('div');

      tempDiv.innerHTML = htmlContent.replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n\n');



      const imgElem = tempDiv.querySelector('img');

      const imgSrc = imgElem ? imgElem.getAttribute('src') : null;

      if (imgElem) imgElem.remove();



      const titleElem = tempDiv.querySelector('h3');

      const title = titleElem ? titleElem.textContent.trim() : 'Información';

      if (titleElem) titleElem.remove();



      let body = tempDiv.textContent.trim();

      body = body.replace(/\n\s*\n/g, '\n\n');



      if (!body) body = "Escultura o detalle arquitectónico de Xochicalco.";

      if (body.length > 550) body = body.substring(0, 547) + '...';



      return { title, body, imgSrc };

    }



    // ========================================================

    // CARGAR ESCENA Y DIBUJAR BOTONES

    // ========================================================

    function loadScene(sceneId) {

      if (!tourData || !tourData.scenes[sceneId]) return;

      currentSceneId = sceneId;

      const scene = tourData.scenes[sceneId];



      document.querySelector('#sky').setAttribute('src', scene.panorama);



      const container = document.querySelector('#hotspots-container');

      container.innerHTML = '';

      document.querySelector('#card-wrapper').setAttribute('visible', 'false');



      if (!scene.hotSpots) return;



      scene.hotSpots.forEach(hs => {

        const absolutePos = pannellumToCartesian(hs.pitch, hs.yaw, 4.0);



        if (hs.type === 'scene') {
          const group = document.createElement('a-entity');
          group.setAttribute('position', absolutePos);

          const sphere = document.createElement('a-sphere');
          sphere.setAttribute('radius', '0.15');
          sphere.setAttribute('color', '#00d2ff');
          sphere.setAttribute('material', 'emissive: #0077b6; emissiveIntensity: 0.8');
          sphere.setAttribute('class', 'clickable');
          sphere.setAttribute('animation', 'property: scale; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 1000');
          sphere.addEventListener('click', () => loadScene(hs.sceneId));

          const ring = document.createElement('a-ring');
          ring.setAttribute('radius-inner', '0.18');
          ring.setAttribute('radius-outer', '0.22');
          ring.setAttribute('color', '#00d2ff');
          ring.setAttribute('material', 'emissive: #00d2ff; emissiveIntensity: 0.5; side: double');
          ring.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear');
          ring.setAttribute('look-at', '#rig');

          const label = document.createElement('a-text');
          label.setAttribute('value', hs.text || "Ir a sala");
          label.setAttribute('align', 'center');
          label.setAttribute('position', '0 0.35 0');
          label.setAttribute('scale', '0.5 0.5 0.5');
          label.setAttribute('color', '#ffffff');
          label.setAttribute('look-at', '#rig');

          group.appendChild(sphere);
          group.appendChild(ring);
          group.appendChild(label);
          container.appendChild(group);

        } else if (hs.type === 'info') {
          const group = document.createElement('a-entity');
          group.setAttribute('position', absolutePos);

          const { title, body, imgSrc } = parseHotspotText(hs.text);

          const infoSphere = document.createElement('a-sphere');
          infoSphere.setAttribute('radius', '0.12');
          infoSphere.setAttribute('color', '#f5a623');
          infoSphere.setAttribute('material', 'emissive: #cc7a00; emissiveIntensity: 0.7');
          infoSphere.setAttribute('class', 'clickable');
          infoSphere.setAttribute('animation', 'property: position; to: 0 0.05 0; dir: alternate; loop: true; dur: 800');



          infoSphere.addEventListener('click', () => {

            const { title, body, imgSrc } = parseHotspotText(hs.text);



            const cardWrapper = document.querySelector('#card-wrapper');

            const cardBg = document.querySelector('#card-bg');

            const cardImg = document.querySelector('#card-img');

            const cardTitle = document.querySelector('#card-title');

            const cardText = document.querySelector('#card-text');

            const cardClose = document.querySelector('#card-close');



            const panelPos = pannellumToCartesian(hs.pitch, hs.yaw, 2.5);

            cardWrapper.setAttribute('position', panelPos);

            cardWrapper.setAttribute('look-at', '#rig');



            if (imgSrc) {

              cardImg.setAttribute('src', imgSrc);

              cardImg.setAttribute('visible', 'true');

              cardBg.setAttribute('height', '3.2');

              cardClose.setAttribute('position', '1.3 1.4 0.03');

              cardTitle.setAttribute('position', '-1.35 0.0 0.02');

              cardText.setAttribute('position', '-1.35 -0.3 0.02');

            } else {

              cardImg.setAttribute('src', '');

              cardImg.setAttribute('visible', 'false');

              cardBg.setAttribute('height', '1.8');

              cardClose.setAttribute('position', '1.3 0.7 0.03');

              cardTitle.setAttribute('position', '-1.35 0.6 0.02');

              cardText.setAttribute('position', '-1.35 0.3 0.02');

            }



            cardTitle.setAttribute('value', title);
            cardText.setAttribute('value', body);
            cardWrapper.setAttribute('visible', 'true');
            cardWrapper.emit('showCard');
          });

          const label = document.createElement('a-text');
          label.setAttribute('value', title);
          label.setAttribute('align', 'center');
          label.setAttribute('position', '0 0.3 0');
          label.setAttribute('scale', '0.4 0.4 0.4');
          label.setAttribute('color', '#f5a623');
          label.setAttribute('look-at', '#rig');

          group.appendChild(infoSphere);
          group.appendChild(label);
          container.appendChild(group);

        }
      });
    }

    document.querySelector('#card-close').addEventListener('click', () => {
      document.querySelector('#card-wrapper').setAttribute('scale', '0 0 0');
      setTimeout(() => document.querySelector('#card-wrapper').setAttribute('visible', 'false'), 100);
    });



    function exitToStandardView() {

      window.location.href = `index.html?scene=${currentSceneId}`;

    }



    // ==========================================

    // HERRAMIENTA PARA OBTENER COORDENADAS AL HACER CLIC

    // ==========================================

    window.addEventListener('click', (e) => {

      if (e.target.id === 'exit-btn' || e.target.closest('#card-wrapper')) return;



      const camera = document.querySelector('[camera]');

      if (camera) {

        const rot = camera.getAttribute('rotation');

        const pitch = rot.x;

        let yaw = -rot.y % 360;



        if (yaw > 180) yaw -= 360;

        if (yaw < -180) yaw += 360;



        console.log(`%c"pitch": ${pitch.toFixed(2)},\n"yaw": ${yaw.toFixed(2)}`, "color: #00d2ff; font-weight: bold; font-size: 14px;");

      }

    });



    // ==========================================

    // HERRAMIENTA DE CALIBRACIÓN EN VIVO (4 DIRECCIONES)

    // ==========================================

    window.addEventListener('keydown', (e) => {

      if (e.key === 'ArrowRight') yawOffset -= 1;

      else if (e.key === 'ArrowLeft') yawOffset += 1;

      else if (e.key === 'ArrowUp') pitchOffset += 1; // Sube la esfera

      else if (e.key === 'ArrowDown') pitchOffset -= 1; // Baja la esfera

      else return;



      console.log(`%c[Calibrador] yawOffset: ${yawOffset} | pitchOffset: ${pitchOffset}`, 'color: #00ffcc; font-weight: bold; font-size: 16px;');

      loadScene(currentSceneId); // Recarga para aplicar la nueva posición visual

    });

  </script>

</body>

</html>
