<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Museo de Sitio de Xochicalco - Modo VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Motor WebXR (A-Frame 1.5.0) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Componente look-at para orientar paneles hacia el usuario -->
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <!-- Estilos desacoplados del módulo VR -->
  <link rel="stylesheet" href="css/vr.css">
</head>
<body>

  <!-- Barra superior 2D de respaldo (antes de insertar el teléfono en el visor) -->
  <div id="vr-hud-2d">
    <button id="exit-btn" type="button">← Volver a vista normal</button>
    <div id="vr-room-badge">Cargando sala...</div>
    <button id="map-btn-2d" type="button">🗺️ Mapa</button>
  </div>

  <!-- Indicador de estado del modo calibración por mirada -->
  <div id="gaze-calib-banner" class="oculto">
    Modo Mover Hotspot con Mirada ACTIVO — Mira un hotspot para engancharlo
  </div>

  <!-- Escena Inmersiva WebXR -->
  <a-scene
    id="escena-vr"
    webxr="optionalFeatures: local-floor;"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true; highRefreshRate: true">

    <!-- Gestor de recursos con soporte CORS para Cloudflare R2 -->
    <a-assets timeout="15000">
      <img id="mapa-museo-asset" src="https://pub-c6d01aa973234af29f7f30a4b35200cf.r2.dev/ASSETS2/110.webp" crossorigin="anonymous" alt="Mapa del Museo">
    </a-assets>

    <!-- Esfera Panorámica 360° alineada a Pannellum (rotation="0 -90 0") -->
    <a-sky id="sky" radius="50" rotation="0 -90 0" material="shader: flat; side: back"></a-sky>

    <!-- Contenedor dinámico de esferas de interacción (Hotspots) -->
    <a-entity id="hotspots-container"></a-entity>

    <!-- Consola Inferior 3D (HUD de Mirada a los pies del usuario) -->
    <a-entity id="hud-3d-dock" position="0 1.6 0">
      <!-- Placa de título de sala actual -->
      <a-plane
        id="hud-title-plane"
        position="0 -1.35 -2.2"
        rotation="-28 0 0"
        width="2.4"
        height="0.42"
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- Botón 3D: Abrir Mapa Interactivo -->
      <a-plane
        id="hud-btn-map"
        class="clickable"
        position="-0.82 -1.72 -2.0"
        rotation="-32 0 0"
        width="0.76"
        height="0.28"
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- Botón 3D: Modo Mover Hotspot con la Mirada (ON / OFF) -->
      <a-plane
        id="hud-btn-edit"
        class="clickable"
        position="0 -1.72 -2.0"
        rotation="-32 0 0"
        width="0.82"
        height="0.28"
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- Botón 3D: Volver a Vista 2D Normal -->
      <a-plane
        id="hud-btn-exit"
        class="clickable"
        position="0.82 -1.72 -2.0"
        rotation="-32 0 0"
        width="0.76"
        height="0.28"
        material="shader: flat; transparent: true">
      </a-plane>
    </a-entity>

    <!-- PANEL DE INFORMACIÓN 3D (Cédulas Bilingües y Carteles) -->
    <a-entity
      id="card-wrapper"
      visible="false"
      scale="0 0 0"
      animation__show="property: scale; to: 1 1 1; dur: 380; easing: easeOutBack; startEvents: showCard">

      <!-- Superficie de la tarjeta renderizada en Canvas 2D HD -->
      <a-plane
        id="card-canvas-plane"
        width="3.1"
        height="2.35"
        position="0 0.12 0.01"
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- Barra de Controles 3D por Mirada debajo de la Cédula -->
      <a-plane
        id="card-btn-lang"
        position="-0.95 -1.24 0.03"
        width="0.78"
        height="0.28"
        material="shader: flat; transparent: true">
      </a-plane>

      <a-plane
        id="card-btn-prev"
        position="-0.28 -1.24 0.03"
        width="0.46"
        height="0.28"
        material="shader: flat; transparent: true">
      </a-plane>

      <a-plane
        id="card-btn-next"
        position="0.28 -1.24 0.03"
        width="0.46"
        height="0.28"
        material="shader: flat; transparent: true">
      </a-plane>

      <a-plane
        id="card-close"
        position="0.95 -1.24 0.03"
        width="0.72"
        height="0.28"
        material="shader: flat; transparent: true">
      </a-plane>
    </a-entity>

    <!-- MAPA DE NAVEGACIÓN 3D INTERACTIVO POR MIRADA -->
    <a-entity
      id="map-3d-wrapper"
      visible="false"
      scale="0 0 0"
      animation__show="property: scale; to: 1 1 1; dur: 380; easing: easeOutBack; startEvents: showMap">

      <!-- Marco dorado y fondo del mapa -->
      <a-plane
        id="map-3d-frame"
        width="3.36"
        height="2.48"
        position="0 0 -0.01"
        color="#D4AF37"
        material="shader: flat">
      </a-plane>

      <a-plane
        id="map-3d-bg"
        width="3.3"
        height="2.42"
        position="0 0 0"
        color="#1A2525"
        material="shader: flat">
      </a-plane>

      <!-- Encabezado del Mapa 3D -->
      <a-plane
        id="map-3d-header"
        width="3.2"
        height="0.28"
        position="0 1.03 0.01"
        material="shader: flat; transparent: true">
      </a-plane>

      <!-- Imagen del Plano del Museo (110.webp) -->
      <a-plane
        id="map-3d-image"
        width="3.0"
        height="1.75"
        position="0 -0.02 0.01"
        material="shader: flat; src: #mapa-museo-asset; transparent: true">
        <!-- Contenedor de los 12 pines interactivos del museo -->
        <a-entity id="map-3d-pins"></a-entity>
      </a-plane>

      <!-- Botón Cerrar Mapa 3D -->
      <a-plane
        id="map-3d-close"
        width="0.88"
        height="0.28"
        position="0 -1.04 0.02"
        material="shader: flat; transparent: true">
      </a-plane>
    </a-entity>

    <!-- Cámara y Retícula de Mirada (Gaze-Only para Celular en Gafas VR) -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="main-camera" look-controls="pointerLockEnabled: false; touchEnabled: true; magicWindowTrackingEnabled: true">
        <!-- Cursor de mirada (Gaze Fuse 1400ms) -->
        <a-cursor
          id="gaze-cursor"
          fuse="true"
          fuse-timeout="1400"
          raycaster="objects: .clickable; far: 30"
          material="color: #00d2ff; shader: flat; opacity: 0.95"
          geometry="primitive: ring; radiusInner: 0.014; radiusOuter: 0.024"
          position="0 0 -1"
          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1400; from: 1 1 1; to: 0.15 0.15 0.15"
          animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeOutQuad; dur: 250; to: 1 1 1"
          animation__click="property: scale; startEvents: click; easing: easeOutBack; dur: 200; from: 0.15 0.15 0.15; to: 1 1 1">
        </a-cursor>

        <!-- Botón flotante para soltar hotspot cuando se está moviendo con la mirada -->
        <a-plane
          id="gaze-drop-btn"
          visible="false"
          position="0 -0.28 -1.1"
          width="0.72"
          height="0.2"
          material="shader: flat; transparent: true">
        </a-plane>
      </a-camera>
    </a-entity>

  </a-scene>

  <!-- Lógica principal desacoplada del módulo VR -->
  <script src="js/vr.js"></script>
</body>
</html>
